name: Feature Request
description: Suggest a feature for repo-fetch
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature!
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this feature solve?
      placeholder: "I'm always frustrated when..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Solution
      description: What would you like to see?
      placeholder: "Add support for..."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What alternatives have you considered?
  - type: dropdown
    id: provider
    attributes:
      label: Related Provider
      options:
        - All
        - GitHub
        - GitLab
        - Bitbucket
        - Azure DevOps
        - Gitea
        - Forgejo
